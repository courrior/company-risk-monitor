name: Daily Risk Monitor

on:
  schedule:
    - cron: '05 01 * * *'  # 国际时间23:42（对应北京时间早上07:42）
  workflow_dispatch: # 允许你在网页上随时手动点击按钮运行，方便测试

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
    - name: 检查代码仓库
      uses: actions/checkout@v4  # 已升级至 v4，适配最新环境

    - name: 设置 Python 环境
      uses: actions/setup-python@v5  # 已升级至 v5，适配最新环境
      with:
        python-version: '3.10'

    - name: 安装运行依赖库
      run: |
        pip install requests feedparser

    - name: 执行监控脚本并发送邮件
      env:
        # 从 GitHub 保险箱中自动读取隐私密钥
        AI_KEY: ${{ secrets.AI_KEY }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: python monitor.py
